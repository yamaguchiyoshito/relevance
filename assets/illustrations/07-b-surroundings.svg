<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">周囲が中心を浮かび上がらせる</title>
<desc id="desc">言葉にできないXの周囲を明確にしていくと、Xの輪郭が周囲から決まる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="560" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#5a4fcf" font-size="18" text-anchor="start" font-weight="700">RELEVANCE     07     図7-2</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">周囲が中心を浮かび上がらせる</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">言葉にできないXの周囲を明確にしていくと、Xの輪郭が周囲から決まる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="600.0" cy="380.0" r="52" fill="none" stroke="#5a4fcf" stroke-width="2" stroke-dasharray="7 6"/>
<text x="600.0" y="390.0" fill="#5a4fcf" font-size="32" text-anchor="middle" font-weight="700">X</text>
<text x="600.0" y="452.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">名前が出てこない俳優</text>
<circle cx="407.7" cy="305.2" r="9" fill="#d0693a"/>
<line x1="407.7" y1="305.2" x2="550.3" y2="342.9" stroke="#d0693a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="407.7" y="287.2" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">刑事ドラマに出ていた</text>
<circle cx="791.1" cy="304.4" r="9" fill="#d0693a"/>
<line x1="791.1" y1="304.4" x2="649.4" y2="342.5" stroke="#d0693a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="791.1" y="286.4" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">あの女優と共演</text>
<circle cx="804.6" cy="445.3" r="9" fill="#d0693a"/>
<line x1="804.6" y1="445.3" x2="652.9" y2="412.4" stroke="#d0693a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="804.6" y="475.3" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">関西の出身</text>
<circle cx="400.8" cy="449.7" r="9" fill="#d0693a"/>
<line x1="400.8" y1="449.7" x2="548.5" y2="414.6" stroke="#d0693a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400.8" y="479.7" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">昔はお笑い</text>
</g>
</svg>
