<text x="335.0" y="560.0" fill="#232a33" font-size="19" text-anchor="middle" font-weight="700">関係は意味であり、意味は分布</text>
<text x="335.0" y="588.0" fill="#232a33" font-size="19" text-anchor="middle" font-weight="400">ゆえに関係も分布</text>
