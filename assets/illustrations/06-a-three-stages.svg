<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">「関係なさそう」には、時間の指標が隠れている</title>
<desc id="desc">AとBの間に何があるかを問うとき、関係は見出されるものになる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><radialGradient id="grel06a-1"><stop offset="0" stop-color="#5a4fcf" stop-opacity="0.55"/><stop offset="0.55" stop-color="#5a4fcf" stop-opacity="0.25"/><stop offset="1" stop-color="#5a4fcf" stop-opacity="0"/></radialGradient><radialGradient id="grel06a-2"><stop offset="0" stop-color="#2f8f83" stop-opacity="0.55"/><stop offset="0.55" stop-color="#2f8f83" stop-opacity="0.25"/><stop offset="1" stop-color="#2f8f83" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="560" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#5a4fcf" font-size="18" text-anchor="start" font-weight="700">RELEVANCE     06     図6-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">「関係なさそう」には、時間の指標が隠れている</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">AとBの間に何があるかを問うとき、関係は見出されるものになる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="230.0" cy="340.0" r="95" fill="url(#grel06a-1)"/>
<circle cx="530.0" cy="340.0" r="95" fill="url(#grel06a-2)"/>
<text x="230.0" y="345.0" fill="#5a4fcf" font-size="30" text-anchor="middle" font-weight="700">A</text>
<text x="530.0" y="345.0" fill="#2f8f83" font-size="30" text-anchor="middle" font-weight="700">B</text>
<text x="380.0" y="352.0" fill="#d0693a" font-size="42" text-anchor="middle" font-weight="700">？</text>
<text x="380.0" y="405.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">間には何がありますか</text>
<text x="880.0" y="240.0" fill="#232a33" font-size="21" text-anchor="middle" font-weight="700">「関係なさそう」の三つの段階</text>
<circle cx="720.0" cy="281.0" r="7" fill="#d0693a"/>
<text x="742.0" y="287.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">一見、関係なさそう</text>
<line x1="720.0" y1="290.0" x2="720.0" y2="317.0" stroke="#d8d4c8" stroke-width="2"/>
<circle cx="720.0" cy="325.0" r="7" fill="#d0693a"/>
<text x="742.0" y="331.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">「現時点では」関係なさそう</text>
<line x1="720.0" y1="334.0" x2="720.0" y2="361.0" stroke="#d8d4c8" stroke-width="2"/>
<circle cx="720.0" cy="369.0" r="7" fill="#d0693a"/>
<text x="742.0" y="375.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">まだ関係を発見できていない</text>
<line x1="720.0" y1="378.0" x2="720.0" y2="405.0" stroke="#d8d4c8" stroke-width="2"/>
<circle cx="720.0" cy="413.0" r="7" fill="#2f8f83"/>
<text x="742.0" y="419.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">これから関係していく</text>
<text x="880.0" y="480.0" fill="#5d6873" font-size="18" text-anchor="middle" font-weight="400">関係は、時間の中で現れる</text>
</g>
</svg>
