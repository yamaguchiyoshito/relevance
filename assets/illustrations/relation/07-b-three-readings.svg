<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">「レビュー」の三つの解釈が、三つの関係になる</title>
<desc id="desc">解釈が割れると、関係の種類まで割れる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="560" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     07     図7-3</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">「レビュー」の三つの解釈が、三つの関係になる</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">解釈が割れると、関係の種類まで割れる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="80" y="320" width="220" height="80" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="190.0" y="356.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">「レビュー」</text>
<text x="190.0" y="388.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">一つの言葉</text>
<line x1="305.0" y1="360.0" x2="395.0" y2="260.0" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="400" y="230" width="300" height="60" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="550.0" y="267.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">検査：欠陥を見つける</text>
<line x1="705.0" y1="260.0" x2="775.0" y2="260.0" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="780" y="230" width="320" height="60" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2" stroke-dasharray="7 6"/>
<text x="940.0" y="267.0" fill="#2f8f83" font-size="16" text-anchor="middle" font-weight="700">補完（第5回）</text>
<line x1="305.0" y1="360.0" x2="395.0" y2="370.0" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="400" y="340" width="300" height="60" rx="10" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="550.0" y="377.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">承認：通すか止めるか</text>
<line x1="705.0" y1="370.0" x2="775.0" y2="370.0" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="780" y="340" width="320" height="60" rx="10" fill="#ffffff" stroke="#d0693a" stroke-width="2" stroke-dasharray="7 6"/>
<text x="940.0" y="377.0" fill="#d0693a" font-size="16" text-anchor="middle" font-weight="700">制約：ゲート（第5回）</text>
<line x1="305.0" y1="360.0" x2="395.0" y2="480.0" stroke="#5a4fcf" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="400" y="450" width="300" height="60" rx="10" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="550.0" y="487.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">学習：読んで学ぶ</text>
<line x1="705.0" y1="480.0" x2="775.0" y2="480.0" stroke="#5a4fcf" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="780" y="450" width="320" height="60" rx="10" fill="#ffffff" stroke="#5a4fcf" stroke-width="2" stroke-dasharray="7 6"/>
<text x="940.0" y="487.0" fill="#5a4fcf" font-size="16" text-anchor="middle" font-weight="700">継承：双方向（第6回）</text>
<text x="50.0" y="532.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">関係について意見が合わないとき、争われているのは言葉の解釈であることが多い。</text>
</g>
</svg>
