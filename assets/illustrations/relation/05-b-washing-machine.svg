<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">代替か補完かは、どの範囲で見るかの問い</title>
<desc id="desc">洗濯機は「洗う」を代替し、「洗濯」の全体では人間を補完する</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="540" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     05     図5-b</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">代替か補完かは、どの範囲で見るかの問い</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">洗濯機は「洗う」を代替し、「洗濯」の全体では人間を補完する</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="200" y="300" width="240" height="70" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="320.0" y="343.0" fill="#2f8f83" font-size="22" text-anchor="middle" font-weight="700">洗う</text>
<rect x="480" y="300" width="240" height="70" rx="10" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="600.0" y="343.0" fill="#5d6873" font-size="22" text-anchor="middle" font-weight="700">干す</text>
<rect x="760" y="300" width="240" height="70" rx="10" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="880.0" y="343.0" fill="#5d6873" font-size="22" text-anchor="middle" font-weight="700">畳む</text>
<rect x="210" y="310" width="220" height="50" rx="8" fill="#2f8f83" opacity="0.18"/>
<text x="320.0" y="290.0" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="700">洗濯機</text>
<path d="M 200 260 L 200 245 L 440 245 L 440 260" fill="none" stroke="#2f8f83" stroke-width="2"/>
<text x="320.0" y="235.0" fill="#2f8f83" font-size="15" text-anchor="middle" font-weight="700">「洗う」の範囲：洗濯板を代替</text>
<path d="M 200 400 L 200 418 L 1000 418 L 1000 400" fill="none" stroke="#d0693a" stroke-width="2"/>
<text x="600.0" y="445.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="700">「洗濯」の範囲：干す・畳むは人のまま。人間を補完</text>
<text x="50.0" y="512.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">「AIは人間を代替するか」に答えが出ないのは、範囲が指定されていないから。</text>
</g>
</svg>
