<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">四つの階層と、四つの部</title>
<desc id="desc">構造・作用・効能・価値を下から順に登る</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     01     図1-2</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">四つの階層と、四つの部</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">構造・作用・効能・価値を下から順に登る</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="150" y="215" width="560" height="64" rx="10" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="190.0" y="255.0" fill="#5a4fcf" font-size="22" text-anchor="start" font-weight="700">価値</text>
<text x="280.0" y="255.0" fill="#232a33" font-size="17" text-anchor="start" font-weight="400">関係がない状態と比べて何が変わるか</text>
<text x="760.0" y="255.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="400">第III部 第10回</text>
<rect x="150" y="293" width="560" height="64" rx="10" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="190.0" y="333.0" fill="#d0693a" font-size="22" text-anchor="start" font-weight="700">効能</text>
<text x="280.0" y="333.0" fill="#232a33" font-size="17" text-anchor="start" font-weight="400">その結果、何が生まれるか</text>
<text x="760.0" y="333.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="400">第III部 第8〜9回</text>
<rect x="150" y="371" width="560" height="64" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="190.0" y="411.0" fill="#2f8f83" font-size="22" text-anchor="start" font-weight="700">作用</text>
<text x="280.0" y="411.0" fill="#232a33" font-size="17" text-anchor="start" font-weight="400">互いに何をしているか</text>
<text x="760.0" y="411.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="400">第II部 第4〜7回</text>
<rect x="150" y="449" width="560" height="64" rx="10" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="190.0" y="489.0" fill="#5d6873" font-size="22" text-anchor="start" font-weight="700">構造</text>
<text x="280.0" y="489.0" fill="#232a33" font-size="17" text-anchor="start" font-weight="400">どうつながっているか</text>
<text x="760.0" y="489.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="400">第I部 第1〜3回</text>
<line x1="120.0" y1="520.0" x2="120.0" y2="215.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<text x="110.0" y="370.0" fill="#5d6873" font-size="14" text-anchor="end" font-weight="400">登る</text>
<rect x="900" y="300" width="240" height="140" rx="12" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="1020.0" y="335.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">第IV部 第11〜12回</text>
<text x="1020.0" y="368.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="700">四階層を束ねて</text>
<text x="1020.0" y="395.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="700">関係を設計する</text>
<text x="50.0" y="572.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">問い：どの関係で、何を生み、何と比べて価値があるのか。</text>
</g>
</svg>
