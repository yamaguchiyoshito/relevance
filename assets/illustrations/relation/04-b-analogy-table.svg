<rect x="740" y="332" width="260" height="48" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="870.0" y="363.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="700">物流拠点</text>
<line x1="465.0" y1="356.0" x2="735.0" y2="356.0" stroke="#5d6873" stroke-width="1.5"/>
