<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">推移するか、しないか</title>
<desc id="desc">「含む」の鎖は端まで通り、「似ている」の鎖は通らない</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     02     図2-2</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">推移するか、しないか</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">「含む」の鎖は端まで通り、「似ている」の鎖は通らない</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60" y="205" width="1080" height="150" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<rect x="140" y="245" width="180" height="60" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="230.0" y="283.0" fill="#2f8f83" font-size="22" text-anchor="middle" font-weight="700">大阪</text>
<rect x="510" y="245" width="180" height="60" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="600.0" y="283.0" fill="#2f8f83" font-size="22" text-anchor="middle" font-weight="700">関西</text>
<rect x="880" y="245" width="180" height="60" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="970.0" y="283.0" fill="#2f8f83" font-size="22" text-anchor="middle" font-weight="700">日本</text>
<line x1="325.0" y1="275.0" x2="505.0" y2="275.0" stroke="#2f8f83" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="415.0" y="262.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">含まれる</text>
<line x1="695.0" y1="275.0" x2="875.0" y2="275.0" stroke="#2f8f83" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="785.0" y="262.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">含まれる</text>
<path d="M 230 310 C 230 328 970 328 970 310" fill="none" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600.0" y="347.0" fill="#2f8f83" font-size="16" text-anchor="middle" font-weight="700">推移する：大阪は日本に含まれる</text>
<rect x="60" y="385" width="1080" height="200" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<circle cx="230.0" cy="448.0" r="11" fill="#5a4fcf"/>
<path d="M 214 492 C 214 466 246 466 246 492 Z" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="230.0" y="516.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">父</text>
<circle cx="600.0" cy="448.0" r="11" fill="#232a33"/>
<path d="M 584 492 C 584 466 616 466 616 492 Z" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="600.0" y="516.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">子</text>
<circle cx="970.0" cy="448.0" r="11" fill="#d0693a"/>
<path d="M 954 492 C 954 466 986 466 986 492 Z" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="970.0" y="516.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">母</text>
<line x1="260.0" y1="460.0" x2="570.0" y2="460.0" stroke="#5a4fcf" stroke-width="2.5"/>
<text x="415.0" y="448.0" fill="#5a4fcf" font-size="15" text-anchor="middle" font-weight="400">目が似ている</text>
<line x1="630.0" y1="460.0" x2="940.0" y2="460.0" stroke="#d0693a" stroke-width="2.5"/>
<text x="785.0" y="448.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="400">鼻が似ている</text>
<path d="M 230 535 C 230 556 970 556 970 535" fill="none" stroke="#5d6873" stroke-width="2" stroke-dasharray="8 7"/>
<text x="600.0" y="578.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="700">推移しない：父と母は似ていない</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">似ているは対称だが推移しない。同じであるは対称で、かつ推移する。</text>
</g>
</svg>
