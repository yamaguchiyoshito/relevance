<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">膨らむ輪と、収まる輪</title>
<desc id="desc">一周すると、原因と結果の席が入れ替わっている</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="630" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     06     図6-2</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">膨らむ輪と、収まる輪</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">一周すると、原因と結果の席が入れ替わっている</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="80" y="205" width="500" height="360" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="330.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">正のフィードバック：増幅</text>
<rect x="130" y="300" width="160" height="60" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="210.0" y="338.0" fill="#2f8f83" font-size="20" text-anchor="middle" font-weight="700">褒める</text>
<rect x="370" y="300" width="160" height="60" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="450.0" y="338.0" fill="#d0693a" font-size="20" text-anchor="middle" font-weight="700">伸びる</text>
<path d="M 295 315 L 365 315" fill="none" stroke="#2f8f83" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 365 345 L 295 345" fill="none" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="330.0" y="290.0" fill="#2f8f83" font-size="12" text-anchor="middle" font-weight="400">原因→結果</text>
<text x="330.0" y="372.0" fill="#d0693a" font-size="12" text-anchor="middle" font-weight="400">結果→原因</text>
<circle cx="330.0" cy="460.0" r="22" fill="none" stroke="#d0693a" stroke-width="1.5"/>
<circle cx="330.0" cy="460.0" r="34" fill="none" stroke="#d0693a" stroke-width="1.5"/>
<circle cx="330.0" cy="460.0" r="46" fill="none" stroke="#d0693a" stroke-width="1.5"/>
<text x="330.0" y="530.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">放っておくと膨らみ続ける</text>
<rect x="620" y="205" width="500" height="360" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="870.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">負のフィードバック：安定化</text>
<rect x="815" y="250" width="110" height="40" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="870.0" y="276.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">疲れる</text>
<rect x="955" y="350" width="110" height="40" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="1010.0" y="376.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">休む</text>
<rect x="675" y="350" width="110" height="40" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="730.0" y="376.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">動く</text>
<rect x="815" y="450" width="110" height="40" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="870.0" y="476.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">回復する</text>
<path d="M 925 280 C 990 300 1010 320 1010 348" fill="none" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1000 392 C 980 440 930 465 928 468" fill="none" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 815 468 C 760 450 735 420 732 392" fill="none" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 735 348 C 745 310 790 285 814 278" fill="none" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="870.0" y="540.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">一定の範囲に収まろうとする</text>
<text x="50.0" y="602.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">どちらが原因かは、どこから見るかで変わる。</text>
</g>
</svg>
