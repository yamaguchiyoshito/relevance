<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Entity体系の見取り図</title>
<desc id="desc">型と実例、関係の束と効能の束、二つをつなぐ規則、根拠</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="700" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     付録　図E</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">Entity体系の見取り図</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">型と実例、関係の束と効能の束、二つをつなぐ規則、根拠</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70" y="200" width="250" height="66" rx="12" fill="#ffffff" stroke="#2f8f83" stroke-width="2.5"/>
<text x="195.0" y="230.0" fill="#2f8f83" font-size="16" text-anchor="middle" font-weight="700">RelationCategory</text>
<text x="195.0" y="252.0" fill="#5d6873" font-size="11.5" text-anchor="middle" font-weight="400">七群（付録A）</text>
<rect x="70" y="300" width="250" height="66" rx="12" fill="#ffffff" stroke="#2f8f83" stroke-width="2.5"/>
<text x="195.0" y="330.0" fill="#2f8f83" font-size="16" text-anchor="middle" font-weight="700">RelationType</text>
<text x="195.0" y="352.0" fill="#5d6873" font-size="11.5" text-anchor="middle" font-weight="400">相似・反対などの概念（型カード）</text>
<rect x="70" y="400" width="250" height="66" rx="12" fill="#ffffff" stroke="#2f8f83" stroke-width="2.5" stroke-dasharray="7 6"/>
<text x="195.0" y="430.0" fill="#2f8f83" font-size="16" text-anchor="middle" font-weight="700">RelationInstance</text>
<text x="195.0" y="452.0" fill="#5d6873" font-size="11.5" text-anchor="middle" font-weight="400">具体的な対象間の関係（実例カード）</text>
<rect x="70" y="500" width="190" height="66" rx="12" fill="#ffffff" stroke="#232a33" stroke-width="2.5"/>
<text x="165.0" y="530.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">Target</text>
<text x="165.0" y="552.0" fill="#5d6873" font-size="11.5" text-anchor="middle" font-weight="400">対象（対象のカード）</text>
<rect x="350" y="200" width="170" height="66" rx="12" fill="#ffffff" stroke="#2f8f83" stroke-width="2.5"/>
<text x="435.0" y="230.0" fill="#2f8f83" font-size="16" text-anchor="middle" font-weight="700">RelationProperty</text>
<text x="435.0" y="252.0" fill="#5d6873" font-size="11.5" text-anchor="middle" font-weight="400">対称・推移・方向</text>
<line x1="195.0" y1="300.0" x2="195.0" y2="270.0" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="205.0" y="288.0" fill="#5d6873" font-size="11" text-anchor="start" font-weight="400">category</text>
<line x1="195.0" y1="400.0" x2="195.0" y2="370.0" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="205.0" y="388.0" fill="#5d6873" font-size="11" text-anchor="start" font-weight="400">relation_type</text>
<line x1="165.0" y1="500.0" x2="165.0" y2="470.0" stroke="#232a33" stroke-width="2" marker-end="url(#arrow)"/>
<text x="175.0" y="488.0" fill="#5d6873" font-size="11" text-anchor="start" font-weight="400">subject / object</text>
<line x1="325.0" y1="318.0" x2="430.0" y2="270.0" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="400.0" y="306.0" fill="#5d6873" font-size="11" text-anchor="start" font-weight="400">properties</text>
<rect x="880" y="200" width="250" height="66" rx="12" fill="#ffffff" stroke="#d0693a" stroke-width="2.5"/>
<text x="1005.0" y="230.0" fill="#d0693a" font-size="16" text-anchor="middle" font-weight="700">EffectCategory</text>
<text x="1005.0" y="252.0" fill="#5d6873" font-size="11.5" text-anchor="middle" font-weight="400">効能の上位分類（付録C-1）</text>
<rect x="880" y="300" width="250" height="66" rx="12" fill="#ffffff" stroke="#d0693a" stroke-width="2.5"/>
<text x="1005.0" y="330.0" fill="#d0693a" font-size="16" text-anchor="middle" font-weight="700">EffectType</text>
<text x="1005.0" y="352.0" fill="#5d6873" font-size="11.5" text-anchor="middle" font-weight="400">発見・創発などの概念（効能の型カード）</text>
<rect x="880" y="400" width="250" height="66" rx="12" fill="#ffffff" stroke="#d0693a" stroke-width="2.5" stroke-dasharray="7 6"/>
<text x="1005.0" y="430.0" fill="#d0693a" font-size="16" text-anchor="middle" font-weight="700">EffectInstance</text>
<text x="1005.0" y="452.0" fill="#5d6873" font-size="11.5" text-anchor="middle" font-weight="400">具体的に発生した効能（効能の実例カード）</text>
<line x1="1005.0" y1="300.0" x2="1005.0" y2="270.0" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1015.0" y="288.0" fill="#5d6873" font-size="11" text-anchor="start" font-weight="400">category</text>
<line x1="1005.0" y1="400.0" x2="1005.0" y2="370.0" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1015.0" y="388.0" fill="#5d6873" font-size="11" text-anchor="start" font-weight="400">effect_type</text>
<rect x="540" y="280" width="270" height="106" rx="12" fill="#ffffff" stroke="#232a33" stroke-width="2.5"/>
<text x="675.0" y="310.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">RelationEffectRule</text>
<text x="675.0" y="332.0" fill="#5d6873" font-size="11.5" text-anchor="middle" font-weight="400"></text>
<text x="675.0" y="332.0" fill="#232a33" font-size="12" text-anchor="middle" font-weight="400">仕組み・前提条件・限界・状態</text>
<text x="675.0" y="352.0" fill="#5d6873" font-size="11" text-anchor="middle" font-weight="400">型と型をつなぐ。実例どうしは直接つながない</text>
<line x1="325.0" y1="333.0" x2="535.0" y2="333.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<text x="430.0" y="322.0" fill="#5d6873" font-size="11" text-anchor="middle" font-weight="400">relation_type</text>
<line x1="815.0" y1="333.0" x2="875.0" y2="333.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<text x="845.0" y="322.0" fill="#5d6873" font-size="11" text-anchor="middle" font-weight="400">effect_type</text>
<path d="M 325 433 C 500 433 700 433 875 433" fill="none" stroke="#d8d4c8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="600.0" y="422.0" fill="#5d6873" font-size="11" text-anchor="middle" font-weight="400">規則が成り立てば、実例から効能の実例が生じる（仮説として）</text>
<rect x="430" y="540" width="340" height="66" rx="12" fill="#ffffff" stroke="#5a4fcf" stroke-width="2.5"/>
<text x="600.0" y="570.0" fill="#5a4fcf" font-size="16" text-anchor="middle" font-weight="700">Evidence</text>
<text x="600.0" y="592.0" fill="#5d6873" font-size="11.5" text-anchor="middle" font-weight="400">根拠と状態：誰が、何を見て、仮説か検証済みか</text>
<path d="M 300 470 C 300 573 340 573 425 573" fill="none" stroke="#5a4fcf" stroke-width="1.5" stroke-dasharray="8 7"/>
<path d="M 900 470 C 900 573 860 573 775 573" fill="none" stroke="#5a4fcf" stroke-width="1.5" stroke-dasharray="8 7"/>
<text x="195.0" y="610.0" fill="#2f8f83" font-size="15" text-anchor="middle" font-weight="700">関係の束</text>
<text x="1005.0" y="610.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="700">効能の束</text>
<text x="50.0" y="672.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">第11回の図11-1（カードの仕組み）と同じ構図。カードの呼び名を Entity 名に置き換えたもの。</text>
</g>
</svg>
