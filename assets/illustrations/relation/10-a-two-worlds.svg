<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">価値は、ない世界との差</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">純効果から費用を引いて、正味の価値</text>
