<text x="600.0" y="575.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">純効果 ＝ ある世界の結果 − ない世界の結果　　正味の価値 ＝ 純効果 − 関係を結び、維持する費用</text>
