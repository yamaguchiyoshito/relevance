<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">「みかんでつながっている」は、三本の線だった</title>
<desc id="desc">同じ二つの県の間に、性質の違う関係が重なっている</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="560" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     01     図1-a</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">「みかんでつながっている」は、三本の線だった</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">同じ二つの県の間に、性質の違う関係が重なっている</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="250.0" cy="400.0" r="16" fill="#5a4fcf"/>
<text x="250.0" y="445.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">和歌山</text>
<circle cx="950.0" cy="400.0" r="16" fill="#5a4fcf"/>
<text x="950.0" y="445.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">愛媛</text>
<circle cx="600.0" cy="245.0" r="12" fill="#5a4fcf"/>
<text x="600.0" y="225.0" fill="#5a4fcf" font-size="15" text-anchor="middle" font-weight="400">みかん（第1クール第7回）</text>
<line x1="265.0" y1="392.0" x2="590.0" y2="252.0" stroke="#5a4fcf" stroke-width="1" stroke-dasharray="8 7"/>
<line x1="935.0" y1="392.0" x2="610.0" y2="252.0" stroke="#5a4fcf" stroke-width="1" stroke-dasharray="8 7"/>
<path d="M 266 390 C 450 330 750 330 934 390" fill="none" stroke="#2f8f83" stroke-width="3"/>
<text x="600.0" y="335.0" fill="#2f8f83" font-size="15" text-anchor="middle" font-weight="700">仲間：どちらも産地（同位）</text>
<line x1="266.0" y1="400.0" x2="934.0" y2="400.0" stroke="#d0693a" stroke-width="3"/>
<text x="600.0" y="392.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="700">競争相手：同じ市場を争う（競合）</text>
<path d="M 266 410 C 450 470 750 470 934 410" fill="none" stroke="#5d6873" stroke-width="3"/>
<text x="600.0" y="478.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="700">比べられる相手：どちらが甘いか（対比）</text>
<text x="50.0" y="532.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">関係は一つに決まらない。種類の違う線が、同じ二者の間に重なる。</text>
</g>
</svg>
