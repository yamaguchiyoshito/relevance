<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">意味の近さと、構造の似方は別の軸</title>
<desc id="desc">意味は遠いが構造は似ている組が、転用の着想源になる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     07     図7-a</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">意味の近さと、構造の似方は別の軸</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">意味は遠いが構造は似ている組が、転用の着想源になる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<line x1="260.0" y1="560.0" x2="940.0" y2="560.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600.0" y="590.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">意味の近さ →</text>
<line x1="260.0" y1="560.0" x2="260.0" y2="230.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<text x="244.0" y="395.0" fill="#5d6873" font-size="15" text-anchor="end" font-weight="400">構造の似方 ↑</text>
<line x1="600.0" y1="560.0" x2="600.0" y2="230.0" stroke="#d8d4c8" stroke-width="1" stroke-dasharray="8 7"/>
<line x1="260.0" y1="395.0" x2="940.0" y2="395.0" stroke="#d8d4c8" stroke-width="1" stroke-dasharray="8 7"/>
<text x="770.0" y="312.5" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">類義語：驚きはない</text>
<text x="430.0" y="477.5" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">本当に無関係</text>
<text x="770.0" y="477.5" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">意味は近いが、構造は違う</text>
<rect x="290" y="250" width="280.0" height="125.0" rx="12" fill="#2f8f83" opacity="0.12"/>
<text x="430.0" y="298.5" fill="#2f8f83" font-size="16" text-anchor="middle" font-weight="700">レビュー滞留 ↔ 工場の仕掛品</text>
<text x="430.0" y="326.5" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="400">意味は遠いが、構造は似ている</text>
<text x="430.0" y="348.5" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="700">＝ 転用の着想源</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">関係は一つではない。同じ二つの対象が、意味の軸では遠く、構造の軸では近い。</text>
</g>
</svg>
