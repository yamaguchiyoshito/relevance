<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">AIの生成 × 人間のレビュー、四つの軸</title>
<desc id="desc">方向・対称性・強度・時間変化の札を貼る</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     02     図2-3</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">AIの生成 × 人間のレビュー、四つの軸</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">方向・対称性・強度・時間変化の札を貼る</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="140" y="330" width="300" height="100" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="290.0" y="376.0" fill="#2f8f83" font-size="26" text-anchor="middle" font-weight="700">AIの生成</text>
<text x="290.0" y="408.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">速さを受け持つ</text>
<rect x="760" y="330" width="300" height="100" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="910.0" y="376.0" fill="#d0693a" font-size="26" text-anchor="middle" font-weight="700">人間のレビュー</text>
<text x="910.0" y="408.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">正しさを受け持つ</text>
<line x1="445.0" y1="352.0" x2="755.0" y2="352.0" stroke="#232a33" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="600.0" y="342.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">順序：生成が先、レビューが後</text>
<line x1="755.0" y1="404.0" x2="445.0" y2="404.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="600.0" y="426.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">依存：レビューは生成がなければ始まらない</text>
<path d="M 180 442 L 180 460 L 1020 460 L 1020 442" fill="none" stroke="#2f8f83" stroke-width="2"/>
<text x="600.0" y="482.0" fill="#2f8f83" font-size="15" text-anchor="middle" font-weight="700">補完：速さと正しさを分け持つ</text>
<rect x="140" y="204" width="300" height="52" rx="10" fill="#ece9e0" stroke="#2f8f83" stroke-width="1.5"/>
<text x="290.0" y="226.0" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="700">方向：双方向</text>
<text x="290.0" y="245.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">指摘が生成へ戻る</text>
<rect x="470" y="204" width="300" height="52" rx="10" fill="#ece9e0" stroke="#d0693a" stroke-width="1.5"/>
<text x="620.0" y="226.0" fill="#d0693a" font-size="14" text-anchor="middle" font-weight="700">対称性：非対称</text>
<text x="620.0" y="245.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">レビューだけが生成を必要とする</text>
<rect x="140" y="514" width="300" height="52" rx="10" fill="#ece9e0" stroke="#2f8f83" stroke-width="1.5"/>
<text x="290.0" y="536.0" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="700">強度：欠陥率に連動</text>
<text x="290.0" y="555.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">質が低いほど強く依存</text>
<rect x="470" y="514" width="300" height="52" rx="10" fill="#ece9e0" stroke="#d0693a" stroke-width="1.5"/>
<text x="620.0" y="536.0" fill="#d0693a" font-size="14" text-anchor="middle" font-weight="700">時間変化：量とともに動く</text>
<text x="620.0" y="555.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">生成量で負荷が変わる</text>
<text x="960.0" y="230.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">三つの意味が</text>
<text x="960.0" y="252.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">一つの形を共有する</text>
</g>
</svg>
