<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">アイスクリームと水難事故</title>
<desc id="desc">向きのない相関の上に、向きのある因果の源がある</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="560" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     03     図3-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">アイスクリームと水難事故</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">向きのない相関の上に、向きのある因果の源がある</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="600.0" cy="250.0" r="34" fill="#d0693a"/>
<text x="600.0" y="258.0" fill="#ffffff" font-size="24" text-anchor="middle" font-weight="700">夏</text>
<circle cx="320.0" cy="460.0" r="30" fill="#2f8f83"/>
<text x="320.0" y="466.0" fill="#ffffff" font-size="16" text-anchor="middle" font-weight="700">アイス</text>
<circle cx="880.0" cy="460.0" r="30" fill="#2f8f83"/>
<text x="880.0" y="466.0" fill="#ffffff" font-size="16" text-anchor="middle" font-weight="700">事故</text>
<line x1="575.0" y1="275.0" x2="345.0" y2="438.0" stroke="#d0693a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="625.0" y1="275.0" x2="855.0" y2="438.0" stroke="#d0693a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="462.0" y="345.0" fill="#d0693a" font-size="16" text-anchor="end" font-weight="400">因果：暑いから売れる</text>
<text x="738.0" y="345.0" fill="#d0693a" font-size="16" text-anchor="start" font-weight="400">因果：暑いから水辺へ</text>
<line x1="352.0" y1="460.0" x2="848.0" y2="460.0" stroke="#5d6873" stroke-width="2" stroke-dasharray="8 7"/>
<text x="600.0" y="490.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">相関：一緒に増える。向きはない</text>
<text x="50.0" y="532.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">アイスを止めても事故は減らない。見えやすい相関が、見えにくい因果に化ける。</text>
</g>
</svg>
