<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">AIの生成 × 人間のレビュー（第5回）</title>
<desc id="desc">目的の枠、人間の時間という資源、代替の範囲、分業</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     05     図5-c</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">AIの生成 × 人間のレビュー（第5回）</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">目的の枠、人間の時間という資源、代替の範囲、分業</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="140" y="330" width="300" height="100" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="290.0" y="376.0" fill="#2f8f83" font-size="26" text-anchor="middle" font-weight="700">AIの生成</text>
<text x="290.0" y="408.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">速さを受け持つ</text>
<rect x="760" y="330" width="300" height="100" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="910.0" y="376.0" fill="#d0693a" font-size="26" text-anchor="middle" font-weight="700">人間のレビュー</text>
<text x="910.0" y="408.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">正しさを受け持つ</text>
<line x1="445.0" y1="360.0" x2="755.0" y2="360.0" stroke="#232a33" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="600.0" y="350.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">順序：生成が先、レビューが後</text>
<line x1="755.0" y1="400.0" x2="445.0" y2="400.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="600.0" y="422.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">依存：レビューは生成がなければ始まらない</text>
<path d="M 180 442 L 180 460 L 1020 460 L 1020 442" fill="none" stroke="#2f8f83" stroke-width="2"/>
<text x="600.0" y="482.0" fill="#2f8f83" font-size="15" text-anchor="middle" font-weight="700">補完：速さと正しさを分け持つ</text>
<rect x="140" y="205" width="920" height="70" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="600.0" y="248.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">目的：正しいコードを速く届ける</text>
<line x1="290.0" y1="326.0" x2="290.0" y2="278.0" stroke="#2f8f83" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="910.0" y1="326.0" x2="910.0" y2="278.0" stroke="#d0693a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="372.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">分業：AIが作り、人が確かめる</text>
<circle cx="600.0" cy="550.0" r="30" fill="#e8c86a"/>
<text x="600.0" y="556.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">時間</text>
<text x="600.0" y="602.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="700">資源：人間の時間は一つ。競合</text>
<line x1="290.0" y1="466.0" x2="566.0" y2="540.0" stroke="#d0693a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="910.0" y1="466.0" x2="634.0" y2="540.0" stroke="#d0693a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="150.0" y="510.0" fill="#5d6873" font-size="13" text-anchor="start" font-weight="400">「コードを書く」の範囲では代替</text>
<text x="150.0" y="530.0" fill="#5d6873" font-size="13" text-anchor="start" font-weight="400">「正しいコードを届ける」の範囲では補完</text>
</g>
</svg>
