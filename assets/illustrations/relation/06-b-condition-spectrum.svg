<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">条件・促進・原因の三段</title>
<desc id="desc">「なければ起きない」「あれば起きやすい」「あれば起きる」</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="520" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     06     図6-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">条件・促進・原因の三段</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">「なければ起きない」「あれば起きやすい」「あれば起きる」</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60" y="205" width="360" height="250" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="240.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">条件（依存）</text>
<text x="240.0" y="285.0" fill="#5d6873" font-size="22" text-anchor="middle" font-weight="700">種</text>
<text x="240.0" y="318.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">なければ起きない</text>
<rect x="120" y="350" width="240" height="12" rx="6" fill="#d8d4c8"/><rect x="120" y="350" width="60" height="12" rx="6" fill="#5d6873"/>
<text x="240.0" y="390.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">結果への寄与の強さ</text>
<rect x="420" y="205" width="360" height="250" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="600.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">促進</text>
<text x="600.0" y="285.0" fill="#2f8f83" font-size="22" text-anchor="middle" font-weight="700">肥料</text>
<text x="600.0" y="318.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">あれば起きやすい</text>
<rect x="480" y="350" width="240" height="12" rx="6" fill="#d8d4c8"/><rect x="480" y="350" width="144" height="12" rx="6" fill="#2f8f83"/>
<text x="600.0" y="390.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">結果への寄与の強さ</text>
<rect x="780" y="205" width="360" height="250" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="960.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">原因</text>
<text x="960.0" y="285.0" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">種・水・温度がそろう</text>
<text x="960.0" y="318.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">あれば起きる</text>
<rect x="840" y="350" width="240" height="12" rx="6" fill="#d8d4c8"/><rect x="840" y="350" width="240" height="12" rx="6" fill="#d0693a"/>
<text x="960.0" y="390.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">結果への寄与の強さ</text>
<line x1="430.0" y1="300.0" x2="410.0" y2="300.0" stroke="#5d6873" stroke-width="1.5"/>
<line x1="790.0" y1="300.0" x2="770.0" y2="300.0" stroke="#5d6873" stroke-width="1.5"/>
<text x="50.0" y="492.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">中間の段は見落とされやすく、原因に格上げされるか、無関係に格下げされがち。</text>
</g>
</svg>
