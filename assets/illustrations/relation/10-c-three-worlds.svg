<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">AIの生成 × 人間のレビュー、三つの世界</title>
<desc id="desc">今の世界、レビューがない世界、生成がない世界</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="650" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     10     図10-3</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">AIの生成 × 人間のレビュー、三つの世界</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">今の世界、レビューがない世界、生成がない世界</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60" y="205" width="360" height="370" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="240.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">今の世界</text>
<rect x="100" y="290" width="120" height="56" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="160.0" y="325.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">生成</text>
<rect x="260" y="290" width="120" height="56" rx="10" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="320.0" y="325.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">レビュー</text>
<text x="240.0" y="420.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">符号は G と R の大小で変わる</text>
<rect x="420" y="205" width="360" height="370" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="600.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">レビューがない世界</text>
<rect x="460" y="290" width="120" height="56" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="520.0" y="325.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">生成</text>
<rect x="620" y="290" width="120" height="56" rx="10" fill="#ffffff" stroke="#d8d4c8" stroke-width="2" stroke-dasharray="7 6"/>
<text x="680.0" y="325.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="700">（なし）</text>
<text x="600.0" y="420.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">速い。欠陥が流出し、手戻りと不可逆の損失が残る</text>
<rect x="780" y="205" width="360" height="370" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="960.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">生成がない世界</text>
<rect x="820" y="290" width="120" height="56" rx="10" fill="#ffffff" stroke="#d8d4c8" stroke-width="2" stroke-dasharray="7 6"/>
<text x="880.0" y="325.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="700">（人間が書く）</text>
<rect x="980" y="290" width="120" height="56" rx="10" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="1040.0" y="325.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">レビュー</text>
<text x="960.0" y="420.0" fill="#232a33" font-size="13" text-anchor="middle" font-weight="400">遅い。レビューは追いつき、滞留は起きない</text>
<text x="420.0" y="520.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="700">差 ＝ レビューの価値</text>
<line x1="420.0" y1="528.0" x2="420.0" y2="560.0" stroke="#d0693a" stroke-width="1.5"/>
<text x="780.0" y="520.0" fill="#2f8f83" font-size="15" text-anchor="middle" font-weight="700">差 ＝ 生成の価値</text>
<line x1="780.0" y1="528.0" x2="780.0" y2="560.0" stroke="#2f8f83" stroke-width="1.5"/>
<text x="50.0" y="622.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">ない世界は観測できない。見つかった欠陥から流出したはずの欠陥を見積もる、という推定の穴が残る。</text>
</g>
</svg>
