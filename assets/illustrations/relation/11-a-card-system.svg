<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">カードの仕組み</title>
<desc id="desc">型と実例、関係の束と効能の束、二つをつなぐ規則、根拠と状態</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="700" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     11     図11-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">カードの仕組み</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">型と実例、関係の束と効能の束、二つをつなぐ規則、根拠と状態</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70" y="215" width="250" height="150" rx="12" fill="#ffffff" stroke="#2f8f83" stroke-width="2.5"/>
<text x="195.0" y="245.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="700">型：相似</text>
<text x="84.0" y="271.0" fill="#232a33" font-size="12" text-anchor="start" font-weight="400">定義 / 形：対称・推移しない</text>
<text x="84.0" y="291.0" fill="#232a33" font-size="12" text-anchor="start" font-weight="400">成立条件</text>
<text x="84.0" y="311.0" fill="#232a33" font-size="12" text-anchor="start" font-weight="400">生じうる効能</text>
<rect x="70" y="420" width="250" height="150" rx="12" fill="#ffffff" stroke="#2f8f83" stroke-width="2.5" stroke-dasharray="7 6"/>
<text x="195.0" y="450.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="700">実例：心臓 × ポンプ</text>
<text x="84.0" y="476.0" fill="#232a33" font-size="12" text-anchor="start" font-weight="400">型：相似</text>
<text x="84.0" y="496.0" fill="#232a33" font-size="12" text-anchor="start" font-weight="400">根拠：誰が、何を見て</text>
<text x="84.0" y="516.0" fill="#232a33" font-size="12" text-anchor="start" font-weight="400">状態：仮説 → 検証済み</text>
<line x1="195.0" y1="370.0" x2="195.0" y2="415.0" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="210.0" y="398.0" fill="#5d6873" font-size="12" text-anchor="start" font-weight="400">二者の間に置く</text>
<rect x="880" y="215" width="250" height="150" rx="12" fill="#ffffff" stroke="#d0693a" stroke-width="2.5"/>
<text x="1005.0" y="245.0" fill="#d0693a" font-size="17" text-anchor="middle" font-weight="700">型：知識転用</text>
<text x="894.0" y="271.0" fill="#232a33" font-size="12" text-anchor="start" font-weight="400">定義 / 帰属：転用先</text>
<text x="894.0" y="291.0" fill="#232a33" font-size="12" text-anchor="start" font-weight="400">価値の向き</text>
<text x="894.0" y="311.0" fill="#232a33" font-size="12" text-anchor="start" font-weight="400"></text>
<rect x="880" y="420" width="250" height="150" rx="12" fill="#ffffff" stroke="#d0693a" stroke-width="2.5" stroke-dasharray="7 6"/>
<text x="1005.0" y="450.0" fill="#d0693a" font-size="17" text-anchor="middle" font-weight="700">実例：血液の循環</text>
<text x="894.0" y="476.0" fill="#232a33" font-size="12" text-anchor="start" font-weight="400">型：知識転用</text>
<text x="894.0" y="496.0" fill="#232a33" font-size="12" text-anchor="start" font-weight="400">根拠 / 状態</text>
<text x="894.0" y="516.0" fill="#232a33" font-size="12" text-anchor="start" font-weight="400"></text>
<line x1="1005.0" y1="370.0" x2="1005.0" y2="415.0" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="430" y="290" width="340" height="200" rx="12" fill="#ffffff" stroke="#232a33" stroke-width="2.5"/>
<text x="600.0" y="320.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="700">規則：相似 → 知識転用</text>
<text x="444.0" y="346.0" fill="#232a33" font-size="12" text-anchor="start" font-weight="400">仕組み：共通構造を抽出し、対応づける</text>
<text x="444.0" y="366.0" fill="#232a33" font-size="12" text-anchor="start" font-weight="400">前提条件：共通構造が特定されている…</text>
<text x="444.0" y="386.0" fill="#232a33" font-size="12" text-anchor="start" font-weight="400">限界：表面的な類似は保証しない</text>
<text x="444.0" y="406.0" fill="#232a33" font-size="12" text-anchor="start" font-weight="400">状態：仮説</text>
<line x1="325.0" y1="290.0" x2="425.0" y2="330.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="775.0" y1="330.0" x2="875.0" y2="290.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<text x="195.0" y="610.0" fill="#2f8f83" font-size="15" text-anchor="middle" font-weight="700">関係の束</text>
<text x="1005.0" y="610.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="700">効能の束</text>
<text x="600.0" y="540.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">二つの束は、直接つながない</text>
<text x="50.0" y="672.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">一組の二者の間に、複数の実例カードを重ねられる。関係は一つではない。</text>
</g>
</svg>
