<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">ない世界の、三つの代用と、それぞれの穴</title>
<desc id="desc">時間で比べる、他と比べる、外してみる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><radialGradient id="grel101-1"><stop offset="0" stop-color="#2f8f83" stop-opacity="0.4"/><stop offset="0.55" stop-color="#2f8f83" stop-opacity="0.18"/><stop offset="1" stop-color="#2f8f83" stop-opacity="0"/></radialGradient><radialGradient id="grel101-2"><stop offset="0" stop-color="#2f8f83" stop-opacity="0.6"/><stop offset="0.55" stop-color="#2f8f83" stop-opacity="0.27"/><stop offset="1" stop-color="#2f8f83" stop-opacity="0"/></radialGradient><radialGradient id="grel101-3"><stop offset="0" stop-color="#2f8f83" stop-opacity="0.5"/><stop offset="0.55" stop-color="#2f8f83" stop-opacity="0.23"/><stop offset="1" stop-color="#2f8f83" stop-opacity="0"/></radialGradient><radialGradient id="grel101-4"><stop offset="0" stop-color="#d0693a" stop-opacity="0.5"/><stop offset="0.55" stop-color="#d0693a" stop-opacity="0.23"/><stop offset="1" stop-color="#d0693a" stop-opacity="0"/></radialGradient><radialGradient id="grel101-5"><stop offset="0" stop-color="#2f8f83" stop-opacity="0.5"/><stop offset="0.55" stop-color="#2f8f83" stop-opacity="0.23"/><stop offset="1" stop-color="#2f8f83" stop-opacity="0"/></radialGradient><radialGradient id="grel101-6"><stop offset="0" stop-color="#d0693a" stop-opacity="0.5"/><stop offset="0.55" stop-color="#d0693a" stop-opacity="0.23"/><stop offset="1" stop-color="#d0693a" stop-opacity="0"/></radialGradient><radialGradient id="grel101-7"><stop offset="0" stop-color="#2f8f83" stop-opacity="0.5"/><stop offset="0.55" stop-color="#2f8f83" stop-opacity="0.23"/><stop offset="1" stop-color="#2f8f83" stop-opacity="0"/></radialGradient><radialGradient id="grel101-8"><stop offset="0" stop-color="#d0693a" stop-opacity="0.5"/><stop offset="0.55" stop-color="#d0693a" stop-opacity="0.23"/><stop offset="1" stop-color="#d0693a" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     10     図10-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">ない世界の、三つの代用と、それぞれの穴</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">時間で比べる、他と比べる、外してみる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60" y="205" width="360" height="350" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="240.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">時間で比べる</text>
<text x="240.0" y="275.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">関係を結ぶ前と後</text>
<line x1="120.0" y1="350.0" x2="360.0" y2="350.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<text x="160.0" y="340.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">前</text>
<text x="320.0" y="340.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">後</text>
<circle cx="160.0" cy="400.0" r="40" fill="url(#grel101-1)"/>
<circle cx="320.0" cy="400.0" r="40" fill="url(#grel101-2)"/>
<circle cx="320.0" cy="400.0" r="5" fill="#d0693a"/>
<text x="240.0" y="500.0" fill="#d0693a" font-size="13" text-anchor="middle" font-weight="700">穴：前と後では、関係以外も変わっている</text>
<rect x="420" y="205" width="360" height="350" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="600.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">他と比べる</text>
<text x="600.0" y="275.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">関係のある組と、ない組</text>
<circle cx="520.0" cy="370.0" r="36" fill="url(#grel101-3)"/>
<circle cx="580.0" cy="370.0" r="36" fill="url(#grel101-4)"/>
<line x1="530.0" y1="370.0" x2="570.0" y2="370.0" stroke="#232a33" stroke-width="2"/>
<circle cx="640.0" cy="420.0" r="36" fill="url(#grel101-5)"/>
<circle cx="700.0" cy="420.0" r="36" fill="url(#grel101-6)"/>
<text x="600.0" y="500.0" fill="#d0693a" font-size="13" text-anchor="middle" font-weight="700">穴：組が違えば、関係以外も違う</text>
<rect x="780" y="205" width="360" height="350" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="960.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">外してみる</text>
<text x="960.0" y="275.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">関係を一度解消する</text>
<circle cx="890.0" cy="390.0" r="44" fill="url(#grel101-7)"/>
<circle cx="1030.0" cy="390.0" r="44" fill="url(#grel101-8)"/>
<line x1="920.0" y1="390.0" x2="950.0" y2="390.0" stroke="#232a33" stroke-width="2"/>
<line x1="970.0" y1="390.0" x2="1000.0" y2="390.0" stroke="#232a33" stroke-width="2"/>
<line x1="952.0" y1="378.0" x2="968.0" y2="402.0" stroke="#d0693a" stroke-width="2.5"/>
<line x1="968.0" y1="378.0" x2="952.0" y2="402.0" stroke="#d0693a" stroke-width="2.5"/>
<text x="960.0" y="500.0" fill="#d0693a" font-size="13" text-anchor="middle" font-weight="700">穴：輪の中では戻ってくる。不可逆なら戻らない</text>
<text x="50.0" y="572.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">代用の穴をどれだけ塞げているかが、価値の主張の確からしさを決める。</text>
</g>
</svg>
