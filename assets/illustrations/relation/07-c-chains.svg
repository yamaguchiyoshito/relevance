<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">連想の鎖と、含意の鎖</title>
<desc id="desc">どちらも有向。含意は推移し、連想は推移しない</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     07     図7-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">連想の鎖と、含意の鎖</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">どちらも有向。含意は推移し、連想は推移しない</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="120.0" y="262.0" fill="#2f8f83" font-size="20" text-anchor="start" font-weight="700">連想</text>
<rect x="230" y="235" width="140" height="56" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="300.0" y="271.0" fill="#2f8f83" font-size="22" text-anchor="middle" font-weight="700">夏</text>
<rect x="530" y="235" width="140" height="56" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="600.0" y="271.0" fill="#2f8f83" font-size="22" text-anchor="middle" font-weight="700">海</text>
<rect x="830" y="235" width="140" height="56" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="900.0" y="271.0" fill="#2f8f83" font-size="22" text-anchor="middle" font-weight="700">塩</text>
<line x1="375.0" y1="263.0" x2="525.0" y2="263.0" stroke="#2f8f83" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="675.0" y1="263.0" x2="825.0" y2="263.0" stroke="#2f8f83" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 300 296 C 300 340 900 340 900 296" fill="none" stroke="#5d6873" stroke-width="2" stroke-dasharray="8 7"/>
<text x="600.0" y="345.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="700">夏から塩は、ほとんど浮かばない：推移しない</text>
<text x="120.0" y="432.0" fill="#d0693a" font-size="20" text-anchor="start" font-weight="700">含意</text>
<rect x="210" y="405" width="180" height="56" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="300.0" y="441.0" fill="#d0693a" font-size="19" text-anchor="middle" font-weight="700">独身男性</text>
<rect x="510" y="405" width="180" height="56" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="600.0" y="441.0" fill="#d0693a" font-size="19" text-anchor="middle" font-weight="700">未婚</text>
<rect x="810" y="405" width="180" height="56" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="900.0" y="441.0" fill="#d0693a" font-size="19" text-anchor="middle" font-weight="700">配偶者がいない</text>
<line x1="395.0" y1="433.0" x2="505.0" y2="433.0" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="695.0" y1="433.0" x2="805.0" y2="433.0" stroke="#d0693a" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 300 466 C 300 505 900 505 900 466" fill="none" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600.0" y="508.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="700">独身男性なら配偶者はいない：推移する</text>
<text x="50.0" y="572.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">意味の関係の中にも、推移するものとしないものが混ざっている。</text>
</g>
</svg>
