<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">関係の形を記述する四つの軸</title>
<desc id="desc">方向・対称性・強度・時間変化</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     02     図2-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">関係の形を記述する四つの軸</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">方向・対称性・強度・時間変化</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60" y="205" width="255" height="390" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="187.5" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">方向</text>
<rect x="335" y="205" width="255" height="390" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="462.5" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">対称性</text>
<rect x="610" y="205" width="255" height="390" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="737.5" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">強度</text>
<rect x="885" y="205" width="255" height="390" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="1012.5" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">時間変化</text>
<line x1="90.0" y1="290.0" x2="280.0" y2="290.0" stroke="#2f8f83" stroke-width="3" marker-end="url(#arrow)"/>
<text x="185.0" y="320.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">一方向：手紙</text>
<line x1="90.0" y1="380.0" x2="280.0" y2="380.0" stroke="#2f8f83" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="280.0" y1="380.0" x2="90.0" y2="380.0" stroke="#2f8f83" stroke-width="3" marker-end="url(#arrow)"/>
<text x="185.0" y="410.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">双方向：会話</text>
<line x1="90.0" y1="470.0" x2="280.0" y2="470.0" stroke="#2f8f83" stroke-width="3"/>
<text x="185.0" y="500.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">無向：同じ町の出身</text>
<circle cx="390.0" cy="300.0" r="10" fill="#2f8f83"/>
<circle cx="540.0" cy="300.0" r="10" fill="#2f8f83"/>
<line x1="400.0" y1="300.0" x2="530.0" y2="300.0" stroke="#2f8f83" stroke-width="3"/>
<text x="462.0" y="340.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">似ている：対称</text>
<circle cx="430.0" cy="430.0" r="60" fill="none" stroke="#2f8f83" stroke-width="2"/>
<circle cx="430.0" cy="430.0" r="18" fill="#d0693a"/>
<text x="462.0" y="520.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">含む：非対称</text>
<line x1="640.0" y1="300.0" x2="840.0" y2="300.0" stroke="#d0693a" stroke-width="7"/>
<text x="740.0" y="335.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">強い依存</text>
<line x1="640.0" y1="430.0" x2="840.0" y2="430.0" stroke="#d0693a" stroke-width="1.2" stroke-dasharray="8 7"/>
<text x="740.0" y="465.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">弱い相関</text>
<text x="740.0" y="540.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">両側で同じとは限らない</text>
<line x1="915.0" y1="300.0" x2="1115.0" y2="300.0" stroke="#5a4fcf" stroke-width="3"/>
<text x="1015.0" y="335.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">固定：大阪は関西の中</text>
<polyline points="915,470 955,420 995,450 1035,390 1075,430 1115,410" fill="none" stroke="#5a4fcf" stroke-width="3"/>
<text x="1015.0" y="505.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">動的：二つの店の競合</text>
<text x="50.0" y="592.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">関係の名前が決まる前に、形は問える。</text>
</g>
</svg>
