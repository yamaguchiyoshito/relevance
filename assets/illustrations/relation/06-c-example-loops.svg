<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">AIの生成 × 人間のレビュー、二つの輪</title>
<desc id="desc">安定させる輪と、膨らませる輪が、同じ二者の間で同時に回りうる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="660" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     06     図6-3</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">AIの生成 × 人間のレビュー、二つの輪</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">安定させる輪と、膨らませる輪が、同じ二者の間で同時に回りうる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60" y="205" width="520" height="390" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="320.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">収まる輪（負のフィードバック）</text>
<rect x="250" y="245" width="140" height="40" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="320.0" y="271.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">生成が増える</text>
<rect x="400" y="360" width="140" height="40" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="470.0" y="386.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">待ちが増える</text>
<rect x="250" y="475" width="140" height="40" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="320.0" y="501.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">生成が減る</text>
<rect x="100" y="360" width="140" height="40" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="170.0" y="386.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">待ちが減る</text>
<path d="M 392 275 C 450 290 470 330 470 358" fill="none" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 465 402 C 450 450 400 480 392 486" fill="none" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 248 486 C 200 470 170 440 170 402" fill="none" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 175 358 C 190 310 240 280 248 275" fill="none" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320.0" y="565.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">どこかの水準に落ち着こうとする</text>
<rect x="620" y="205" width="520" height="390" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="880.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">膨らむ輪（正のフィードバック）</text>
<rect x="800" y="245" width="160" height="40" rx="10" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="880.0" y="271.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">待ちが増える</text>
<rect x="950" y="360" width="160" height="40" rx="10" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="1030.0" y="386.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">レビューが雑になる</text>
<rect x="800" y="475" width="160" height="40" rx="10" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="880.0" y="501.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">欠陥が流出する</text>
<rect x="650" y="360" width="160" height="40" rx="10" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="730.0" y="386.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">手戻りが起きる</text>
<path d="M 962 275 C 1010 290 1030 330 1030 358" fill="none" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1025 402 C 1010 450 960 480 962 486" fill="none" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 798 486 C 750 470 730 440 730 402" fill="none" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 735 358 C 750 310 790 280 798 275" fill="none" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="880.0" y="565.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">放っておくと膨らむ</text>
<text x="50.0" y="632.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">どちらの輪が勝つかは、二者の性質ではなく、待ちが越える境目で決まる（第9回）。</text>
