<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">レビューが丁寧なチームは、欠陥が少ない</title>
<desc id="desc">相関か、因果か、第三の原因か</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="580" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     03     図3-3</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">レビューが丁寧なチームは、欠陥が少ない</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">相関か、因果か、第三の原因か</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="600.0" cy="250.0" r="54" fill="none" stroke="#d0693a" stroke-width="3"/>
<text x="600.0" y="256.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="700">丁寧なチーム</text>
<text x="600.0" y="182.0" fill="#d0693a" font-size="14" text-anchor="middle" font-weight="400">第三の原因？</text>
<circle cx="300.0" cy="460.0" r="34" fill="#2f8f83"/>
<text x="300.0" y="466.0" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="700">レビュー</text>
<circle cx="900.0" cy="460.0" r="34" fill="#2f8f83"/>
<text x="900.0" y="466.0" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="700">少ない欠陥</text>
<line x1="560.0" y1="290.0" x2="330.0" y2="438.0" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<line x1="640.0" y1="290.0" x2="870.0" y2="438.0" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<line x1="336.0" y1="448.0" x2="864.0" y2="448.0" stroke="#2f8f83" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="600.0" y="438.0" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="400">因果？：レビューが欠陥を減らす</text>
<line x1="864.0" y1="472.0" x2="336.0" y2="472.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="600.0" y="500.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">逆向きの因果？：欠陥の少ないコードはレビューが通りやすい</text>
<text x="50.0" y="552.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">観察は同じでも、三つの読み方がある。どれかは、向きと時間と仕組みを確かめるまで決まらない。</text>
</g>
</svg>
