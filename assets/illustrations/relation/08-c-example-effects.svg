<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">AIの生成 × 人間のレビュー、効能の帰属</title>
<desc id="desc">直接の効能、間接の効能、関係そのもの、全体</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     08     図8-3</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">AIの生成 × 人間のレビュー、効能の帰属</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">直接の効能、間接の効能、関係そのもの、全体</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="80" y="205" width="1040" height="330" rx="18" fill="none" stroke="#5a4fcf" stroke-width="2" stroke-dasharray="8 7"/>
<text x="600.0" y="240.0" fill="#5a4fcf" font-size="16" text-anchor="middle" font-weight="700">全体：開発全体の処理量 ── 符号は未決（＋か−かは条件次第）</text>
<rect x="140" y="290" width="300" height="90" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="290.0" y="343.0" fill="#2f8f83" font-size="24" text-anchor="middle" font-weight="700">AIの生成</text>
<rect x="760" y="290" width="300" height="90" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="910.0" y="343.0" fill="#d0693a" font-size="24" text-anchor="middle" font-weight="700">人間のレビュー</text>
<text x="290.0" y="420.0" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="700">直接の効能：時間の短縮（＋）</text>
<text x="290.0" y="442.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">帰属：全体の速さ</text>
<text x="910.0" y="420.0" fill="#d0693a" font-size="14" text-anchor="middle" font-weight="700">直接の効能：欠陥の検出（＋）</text>
<text x="910.0" y="442.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">帰属：コードという対象</text>
<line x1="445.0" y1="335.0" x2="755.0" y2="335.0" stroke="#232a33" stroke-width="3"/>
<text x="600.0" y="320.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">関係そのもの</text>
<text x="600.0" y="372.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">間接の効能：滞留（−）、手戻り（−）</text>
<text x="600.0" y="394.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">信頼の変化（±）：依存の強度を書き換える</text>
<text x="600.0" y="500.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">直接の正と間接の負のどちらが大きいかは、関係の種類からは出てこない</text>
</g>
</svg>
