<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">効能は、どこに帰属するか</title>
<desc id="desc">対象への効能、関係そのものへの効能、全体への効能</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><radialGradient id="grel08b-1"><stop offset="0" stop-color="#2f8f83" stop-opacity="0.55"/><stop offset="0.55" stop-color="#2f8f83" stop-opacity="0.25"/><stop offset="1" stop-color="#2f8f83" stop-opacity="0"/></radialGradient><radialGradient id="grel08b-2"><stop offset="0" stop-color="#d0693a" stop-opacity="0.55"/><stop offset="0.55" stop-color="#d0693a" stop-opacity="0.25"/><stop offset="1" stop-color="#d0693a" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="650" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">RELATION     08     図8-2</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">効能は、どこに帰属するか</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">対象への効能、関係そのものへの効能、全体への効能</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="200" y="215" width="800" height="340" rx="22" fill="none" stroke="#5a4fcf" stroke-width="2" stroke-dasharray="8 7"/>
<text x="600.0" y="250.0" fill="#5a4fcf" font-size="17" text-anchor="middle" font-weight="700">全体：家庭の空気</text>
<circle cx="430.0" cy="400.0" r="110" fill="url(#grel08b-1)"/>
<text x="430.0" y="406.0" fill="#2f8f83" font-size="26" text-anchor="middle" font-weight="700">夫</text>
<circle cx="770.0" cy="400.0" r="110" fill="url(#grel08b-2)"/>
<text x="770.0" y="406.0" fill="#d0693a" font-size="26" text-anchor="middle" font-weight="700">妻</text>
<line x1="500.0" y1="400.0" x2="700.0" y2="400.0" stroke="#232a33" stroke-width="3"/>
<text x="600.0" y="385.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">関係そのもの：信頼</text>
<text x="430.0" y="520.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">対象への効能：夫の考えが変わる</text>
<text x="770.0" y="520.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">対象への効能：妻の考えが変わる</text>
<text x="600.0" y="440.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">二人の考えは変わらないのに、間が変わることがある</text>
<text x="50.0" y="622.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">どこに帰属するかで、測る場所が変わる。夫の変化を測っても、信頼の変化は見えない。</text>
</g>
</svg>
