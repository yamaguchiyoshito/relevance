<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">意味の形：点か、集合か、分布か</title>
<desc id="desc">同じ「鳥」を三つのモデルで描く</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><radialGradient id="grel03a-1"><stop offset="0" stop-color="#5a4fcf" stop-opacity="0.6"/><stop offset="0.55" stop-color="#5a4fcf" stop-opacity="0.27"/><stop offset="1" stop-color="#5a4fcf" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#5a4fcf" font-size="18" text-anchor="start" font-weight="700">RELEVANCE     03     図3-a</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">意味の形：点か、集合か、分布か</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">同じ「鳥」を三つのモデルで描く</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60" y="205" width="340" height="390" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="230.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">点：一つの定義</text>
<circle cx="230.0" cy="390.0" r="11" fill="#5a4fcf"/>
<line x1="230.0" y1="379.0" x2="230.0" y2="330.0" stroke="#5a4fcf" stroke-width="2"/>
<text x="230.0" y="318.0" fill="#5a4fcf" font-size="22" text-anchor="middle" font-weight="700">「鳥」</text>
<text x="230.0" y="440.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">動かない。当てはまるか</text>
<text x="230.0" y="462.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">当てはまらないかだけ</text>
<text x="230.0" y="560.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">意味の揺れを説明できない</text>
<rect x="430" y="205" width="340" height="390" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="600.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">集合：中か外か</text>
<rect x="490" y="275" width="220" height="200" rx="18" fill="#ffffff" stroke="#5a4fcf" stroke-width="3"/>
<circle cx="560.0" cy="312.0" r="6" fill="#5a4fcf"/>
<text x="560.0" y="336.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">スズメ</text>
<circle cx="650.0" cy="312.0" r="6" fill="#5a4fcf"/>
<text x="650.0" y="336.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">カラス</text>
<circle cx="600.0" cy="402.0" r="6" fill="#5a4fcf"/>
<text x="600.0" y="426.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">ペンギン</text>
<circle cx="600.0" cy="525.0" r="6" fill="#5d6873"/>
<text x="600.0" y="548.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">コウモリ</text>
<text x="600.0" y="580.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">スズメとペンギンの違いを説明できない</text>
<rect x="800" y="205" width="340" height="390" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="970.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">分布：濃淡</text>
<circle cx="970.0" cy="390.0" r="140" fill="url(#grel03a-1)"/>
<circle cx="970.0" cy="390.0" r="6" fill="#5a4fcf"/>
<text x="970.0" y="372.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="700">スズメ</text>
<circle cx="1010.0" cy="420.0" r="5" fill="#5a4fcf"/>
<text x="1030.0" y="440.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">カラス</text>
<circle cx="885.0" cy="470.0" r="5" fill="#d0693a"/>
<text x="885.0" y="492.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="400">ペンギン</text>
<circle cx="1095.0" cy="540.0" r="4" fill="#5d6873"/>
<text x="1095.0" y="562.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">コウモリ</text>
<text x="970.0" y="580.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">高さの違いとして表せる</text>
</g>
</svg>
