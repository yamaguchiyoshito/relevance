<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">関係もまた、ぼやけた縁を持つ分布</title>
<desc id="desc">「海」と「夏」の重なりに、それ自体が意味の雲として関係が立ち上がる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><radialGradient id="grel05a-1"><stop offset="0" stop-color="#2f8f83" stop-opacity="0.55"/><stop offset="0.55" stop-color="#2f8f83" stop-opacity="0.25"/><stop offset="1" stop-color="#2f8f83" stop-opacity="0"/></radialGradient><radialGradient id="grel05a-2"><stop offset="0" stop-color="#d0693a" stop-opacity="0.55"/><stop offset="0.55" stop-color="#d0693a" stop-opacity="0.25"/><stop offset="1" stop-color="#d0693a" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#5a4fcf" font-size="18" text-anchor="start" font-weight="700">RELEVANCE     05     図5-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">関係もまた、ぼやけた縁を持つ分布</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">「海」と「夏」の重なりに、それ自体が意味の雲として関係が立ち上がる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="470.0" cy="380.0" r="160" fill="url(#grel05a-1)"/>
<circle cx="730.0" cy="380.0" r="160" fill="url(#grel05a-2)"/>
<text x="400.0" y="388.0" fill="#2f8f83" font-size="34" text-anchor="middle" font-weight="700">海</text>
<text x="800.0" y="388.0" fill="#d0693a" font-size="34" text-anchor="middle" font-weight="700">夏</text>
<text x="600.0" y="345.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">海水浴</text>
<text x="600.0" y="372.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">日焼け・花火の帰り道</text>
<text x="600.0" y="395.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">潮の匂い・青い色</text>
<text x="600.0" y="420.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">…</text>
<text x="600.0" y="530.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">関係は意味であり、意味は分布である。ゆえに関係も分布</text>
</g>
</svg>
