<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">言葉は、意味を掴んで動かすための取っ手</title>
<desc id="desc">鍋そのものは持てない。取っ手を握れば、中身がまるごと動く</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><radialGradient id="grel11a-1"><stop offset="0" stop-color="#5a4fcf" stop-opacity="0.5"/><stop offset="0.55" stop-color="#5a4fcf" stop-opacity="0.23"/><stop offset="1" stop-color="#5a4fcf" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#5a4fcf" font-size="18" text-anchor="start" font-weight="700">RELEVANCE     11     図11-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">言葉は、意味を掴んで動かすための取っ手</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">鍋そのものは持てない。取っ手を握れば、中身がまるごと動く</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="600.0" cy="420.0" r="135" fill="url(#grel11a-1)"/>
<text x="600.0" y="415.0" fill="#5a4fcf" font-size="28" text-anchor="middle" font-weight="700">意味</text>
<text x="600.0" y="444.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">ぼやけた縁を持つ分布</text>
<path d="M 505 300 C 505 232 695 232 695 300" fill="none" stroke="#d0693a" stroke-width="6"/>
<text x="600.0" y="238.0" fill="#d0693a" font-size="20" text-anchor="middle" font-weight="700">言葉（取っ手）</text>
<text x="300.0" y="420.0" fill="#232a33" font-size="18" text-anchor="end" font-weight="400">「鳥」と握れば</text>
<text x="300.0" y="446.0" fill="#5d6873" font-size="16" text-anchor="end" font-weight="400">スズメからペンギンまでが</text>
<text x="300.0" y="468.0" fill="#5d6873" font-size="16" text-anchor="end" font-weight="400">まるごと持ち上がる</text>
<text x="900.0" y="420.0" fill="#232a33" font-size="18" text-anchor="start" font-weight="400">縁を確定させる必要はない</text>
<text x="900.0" y="446.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="400">別の雲の隣に置けば</text>
<text x="900.0" y="468.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="400">間に何かが立ち上がる</text>
</g>
</svg>
