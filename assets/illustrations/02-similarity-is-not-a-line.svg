<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">「似ている」は、二点を結ぶ一本の線ではない</title>
<desc id="desc">判定は見る側の前提で割れ、前提を揃えても境目は引けない</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><linearGradient id="g02-bar" x1="0" x2="1"><stop offset="0" stop-color="#2b5fd9"/><stop offset="1" stop-color="#2fa36a"/></linearGradient></defs>
<rect width="1200" height="680" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#5a4fcf" font-size="18" text-anchor="start" font-weight="700">RELEVANCE     02</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">「似ている」は、二点を結ぶ一本の線ではない</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">判定は見る側の前提で割れ、前提を揃えても境目は引けない</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60" y="205" width="330" height="400" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="225.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">頭の中のイメージ</text>
<circle cx="130.0" cy="400.0" r="13" fill="#5a4fcf"/>
<circle cx="320.0" cy="400.0" r="13" fill="#2f8f83"/>
<line x1="143.0" y1="400.0" x2="307.0" y2="400.0" stroke="#232a33" stroke-width="3"/>
<text x="130.0" y="445.0" fill="#5a4fcf" font-size="22" text-anchor="middle" font-weight="700">A</text>
<text x="320.0" y="445.0" fill="#2f8f83" font-size="22" text-anchor="middle" font-weight="700">B</text>
<text x="225.0" y="380.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">線がある？</text>
<text x="225.0" y="560.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="400">線は、AとBの間にはなく</text>
<text x="225.0" y="586.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="400">見る側の前提の中にある</text>
<rect x="430" y="205" width="330" height="400" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="595.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">不揃いな前提</text>
<text x="595.0" y="265.0" fill="#232a33" font-size="21" text-anchor="middle" font-weight="700">トマト と リンゴ</text>
<rect x="470" y="300" width="250" height="62" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="595.0" y="327.0" fill="#d0693a" font-size="20" text-anchor="middle" font-weight="700">台所：違う</text>
<text x="595.0" y="359.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">野菜と果物</text>
<rect x="470" y="385" width="250" height="62" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="595.0" y="412.0" fill="#2f8f83" font-size="20" text-anchor="middle" font-weight="700">植物学：同じ</text>
<text x="595.0" y="444.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">どちらも果実</text>
<rect x="470" y="470" width="250" height="62" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="595.0" y="497.0" fill="#5a4fcf" font-size="20" text-anchor="middle" font-weight="700">食卓：似ている</text>
<text x="595.0" y="529.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">赤くて丸い</text>
<text x="595.0" y="575.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">どれも正しい。前提が違うだけ</text>
<rect x="800" y="205" width="340" height="400" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="970.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">境界は明確か？</text>
<rect x="840" y="300" width="260" height="56" rx="10" fill="url(#g02-bar)"/>
<text x="840.0" y="385.0" fill="#2b5fd9" font-size="20" text-anchor="start" font-weight="700">青</text>
<text x="1100.0" y="385.0" fill="#2fa36a" font-size="20" text-anchor="end" font-weight="700">緑</text>
<line x1="900.0" y1="300.0" x2="900.0" y2="356.0" stroke="#ffffff" stroke-width="1" stroke-dasharray="8 7"/>
<text x="900.0" y="290.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">？</text>
<line x1="950.0" y1="300.0" x2="950.0" y2="356.0" stroke="#ffffff" stroke-width="1" stroke-dasharray="8 7"/>
<text x="950.0" y="290.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">？</text>
<line x1="1000.0" y1="300.0" x2="1000.0" y2="356.0" stroke="#ffffff" stroke-width="1" stroke-dasharray="8 7"/>
<text x="1000.0" y="290.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">？</text>
<line x1="1050.0" y1="300.0" x2="1050.0" y2="356.0" stroke="#ffffff" stroke-width="1" stroke-dasharray="8 7"/>
<text x="1050.0" y="290.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">？</text>
<text x="970.0" y="440.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">どこから緑？</text>
<text x="970.0" y="500.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="400">言葉には輪郭があるが</text>
<text x="970.0" y="526.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="400">言葉が指すものには輪郭がない</text>
<text x="970.0" y="575.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">白黒ではなく、濃淡</text>
<text x="50.0" y="652.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">食い違いの根は、意味に明確な境界があるという無意識の前提にある。</text>
</g>
</svg>
