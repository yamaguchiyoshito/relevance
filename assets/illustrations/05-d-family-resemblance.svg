<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">家族的類似：全員に共通する一つの特徴はない</title>
<desc id="desc">隣り合うものだけが部分的に似ていて、それでも家族だと分かる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#5a4fcf" font-size="18" text-anchor="start" font-weight="700">RELEVANCE     05     図5-4</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">家族的類似：全員に共通する一つの特徴はない</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">隣り合うものだけが部分的に似ていて、それでも家族だと分かる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="230.0" cy="380.0" r="110" fill="none" stroke="#5a4fcf" stroke-width="3"/>
<text x="230.0" y="388.0" fill="#5a4fcf" font-size="30" text-anchor="middle" font-weight="700">A</text>
<circle cx="420.0" cy="380.0" r="110" fill="none" stroke="#2f8f83" stroke-width="3"/>
<text x="420.0" y="388.0" fill="#2f8f83" font-size="30" text-anchor="middle" font-weight="700">B</text>
<circle cx="610.0" cy="380.0" r="110" fill="none" stroke="#d0693a" stroke-width="3"/>
<text x="610.0" y="388.0" fill="#d0693a" font-size="30" text-anchor="middle" font-weight="700">C</text>
<circle cx="800.0" cy="380.0" r="110" fill="none" stroke="#5d6873" stroke-width="3"/>
<text x="800.0" y="388.0" fill="#5d6873" font-size="30" text-anchor="middle" font-weight="700">D</text>
<text x="325.0" y="388.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">目</text>
<text x="325.0" y="410.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">似ている</text>
<text x="515.0" y="388.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">鼻</text>
<text x="515.0" y="410.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">似ている</text>
<text x="705.0" y="388.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">輪郭</text>
<text x="705.0" y="410.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">似ている</text>
<text x="515.0" y="540.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="400">AとDは直接は似ていない。それでも、ひとつながりの家族</text>
<rect x="880" y="215" width="260" height="370" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="1010.0" y="249.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">「鳥」の枝の中で</text>
<circle cx="1010.0" cy="300.0" r="7" fill="#5a4fcf"/>
<text x="1010.0" y="282.0" fill="#5a4fcf" font-size="18" text-anchor="middle" font-weight="700">鳥</text>
<line x1="1010.0" y1="307.0" x2="950.0" y2="380.0" stroke="#5a4fcf" stroke-width="1.5"/>
<line x1="1010.0" y1="307.0" x2="1070.0" y2="470.0" stroke="#5a4fcf" stroke-width="1.5"/>
<circle cx="950.0" cy="380.0" r="6" fill="#2f8f83"/>
<text x="950.0" y="405.0" fill="#2f8f83" font-size="15" text-anchor="middle" font-weight="400">スズメ：近い</text>
<circle cx="1070.0" cy="470.0" r="6" fill="#d0693a"/>
<text x="1070.0" y="495.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="400">ペンギン：遠い</text>
<text x="1010.0" y="555.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">同じ枝の中。距離が違う</text>
</g>
</svg>
