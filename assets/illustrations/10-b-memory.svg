<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">記憶も同じ形をしている</title>
<desc id="desc">思い出すことと作り出すことは、脳の中では同じ動作</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#5a4fcf" font-size="18" text-anchor="start" font-weight="700">RELEVANCE     10     図10-2</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">記憶も同じ形をしている</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">思い出すことと作り出すことは、脳の中では同じ動作</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70" y="330" width="300" height="100" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="220.0" y="376.0" fill="#5a4fcf" font-size="24" text-anchor="middle" font-weight="700">思い出す</text>
<text x="220.0" y="408.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">＝ 生成</text>
<line x1="375.0" y1="380.0" x2="440.0" y2="380.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="445" y="335" width="330" height="90" rx="12" fill="#ffffff" stroke="#d8d4c8" stroke-width="2"/>
<text x="610.0" y="372.0" fill="#232a33" font-size="19" text-anchor="middle" font-weight="400">「あのとき、こう言い返した」</text>
<text x="610.0" y="400.0" fill="#232a33" font-size="19" text-anchor="middle" font-weight="400">という記憶</text>
<path d="M 775 360 C 820 360 820 250 860 250" fill="none" stroke="#d0693a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 775 400 C 820 400 820 520 860 520" fill="none" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="865" y="205" width="265" height="90" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="997.5" y="246.0" fill="#d0693a" font-size="21" text-anchor="middle" font-weight="700">照合</text>
<text x="997.5" y="278.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">日記・写真・他人の証言</text>
<line x1="997.0" y1="300.0" x2="997.0" y2="325.0" stroke="#5d6873" stroke-width="1.5"/>
<line x1="997.0" y1="325.0" x2="930.0" y2="345.0" stroke="#5d6873" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="997.0" y1="325.0" x2="1064.0" y2="345.0" stroke="#5d6873" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="915.0" y="380.0" fill="#2f8f83" font-size="16" text-anchor="middle" font-weight="700">一致</text>
<text x="915.0" y="404.0" fill="#232a33" font-size="19" text-anchor="middle" font-weight="700">本当にあった</text>
<text x="1080.0" y="380.0" fill="#d0693a" font-size="16" text-anchor="middle" font-weight="700">不一致</text>
<text x="1080.0" y="404.0" fill="#232a33" font-size="19" text-anchor="middle" font-weight="700">作られた記憶</text>
<rect x="865" y="475" width="265" height="90" rx="12" fill="none" stroke="#2f8f83" stroke-width="2" stroke-dasharray="8 7"/>
<text x="997.0" y="512.0" fill="#2f8f83" font-size="21" text-anchor="middle" font-weight="700">照合なし</text>
<text x="997.0" y="542.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">→ 仮説のまま信じられる</text>
<text x="610.0" y="470.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">鮮明さは、本当にあったことの証拠にならない</text>
</g>
</svg>
