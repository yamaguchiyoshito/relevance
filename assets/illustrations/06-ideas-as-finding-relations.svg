<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">アイデアとは関係を見出すこと。見出された関係は仮説</title>
<desc id="desc">「関係なさそう」に隠れた時間の指標と、検証による二つの行き先</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><radialGradient id="g06-1"><stop offset="0" stop-color="#5a4fcf" stop-opacity="0.55"/><stop offset="0.55" stop-color="#5a4fcf" stop-opacity="0.25"/><stop offset="1" stop-color="#5a4fcf" stop-opacity="0"/></radialGradient><radialGradient id="g06-2"><stop offset="0" stop-color="#2f8f83" stop-opacity="0.55"/><stop offset="0.55" stop-color="#2f8f83" stop-opacity="0.25"/><stop offset="1" stop-color="#2f8f83" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="700" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#5a4fcf" font-size="18" text-anchor="start" font-weight="700">RELEVANCE     06</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">アイデアとは関係を見出すこと。見出された関係は仮説</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">「関係なさそう」に隠れた時間の指標と、検証による二つの行き先</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="260.0" cy="300.0" r="95" fill="url(#g06-1)"/>
<circle cx="560.0" cy="300.0" r="95" fill="url(#g06-2)"/>
<text x="260.0" y="305.0" fill="#5a4fcf" font-size="30" text-anchor="middle" font-weight="700">A</text>
<text x="560.0" y="305.0" fill="#2f8f83" font-size="30" text-anchor="middle" font-weight="700">B</text>
<text x="410.0" y="312.0" fill="#d0693a" font-size="42" text-anchor="middle" font-weight="700">？</text>
<text x="410.0" y="365.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">間には何がありますか</text>
<text x="880.0" y="240.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">「関係なさそう」の三つの段階</text>
<circle cx="735.0" cy="276.0" r="6" fill="#d0693a"/>
<text x="755.0" y="282.0" fill="#232a33" font-size="18" text-anchor="start" font-weight="400">一見、関係なさそう</text>
<line x1="735.0" y1="284.0" x2="735.0" y2="308.0" stroke="#d8d4c8" stroke-width="2"/>
<circle cx="735.0" cy="316.0" r="6" fill="#d0693a"/>
<text x="755.0" y="322.0" fill="#232a33" font-size="18" text-anchor="start" font-weight="400">「現時点では」関係なさそう</text>
<line x1="735.0" y1="324.0" x2="735.0" y2="348.0" stroke="#d8d4c8" stroke-width="2"/>
<circle cx="735.0" cy="356.0" r="6" fill="#d0693a"/>
<text x="755.0" y="362.0" fill="#232a33" font-size="18" text-anchor="start" font-weight="400">まだ関係を発見できていない</text>
<line x1="735.0" y1="364.0" x2="735.0" y2="388.0" stroke="#d8d4c8" stroke-width="2"/>
<circle cx="735.0" cy="396.0" r="6" fill="#2f8f83"/>
<text x="755.0" y="402.0" fill="#232a33" font-size="18" text-anchor="start" font-weight="400">これから関係していく</text>
<text x="600.0" y="445.0" fill="#5a4fcf" font-size="28" text-anchor="middle" font-weight="700">関連は仮説に過ぎない</text>
<line x1="600.0" y1="462.0" x2="600.0" y2="500.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<text x="640.0" y="490.0" fill="#5d6873" font-size="17" text-anchor="start" font-weight="400">行動による検証</text>
<rect x="120" y="520" width="430" height="110" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="335.0" y="571.0" fill="#2f8f83" font-size="24" text-anchor="middle" font-weight="700">検証された</text>
<text x="335.0" y="603.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">ゴボウの実 → 面ファスナー：何年もの試作を経て</text>
<rect x="650" y="520" width="430" height="110" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2" stroke-dasharray="8 7"/>
<text x="865.0" y="571.0" fill="#d0693a" font-size="24" text-anchor="middle" font-weight="700">検証で消えた</text>
<text x="865.0" y="603.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">血液型 → 性格：信じられ、行動されたが、支持されず</text>
<text x="50.0" y="672.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">見出すことと検証することは、別の行為。既存の要素の新しい組み合わせ（ヤング）。</text>
</g>
</svg>
