<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">問いの形を変えると、判定が生成に変わる</title>
<desc id="desc">「ありますか」から「間には何がありますか」へ</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#5a4fcf" font-size="18" text-anchor="start" font-weight="700">RELEVANCE     06     図6-3</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">問いの形を変えると、判定が生成に変わる</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">「ありますか」から「間には何がありますか」へ</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="120" y="220" width="560" height="56" rx="12" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="400.0" y="255.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">AとBには関係がありますか？</text>
<line x1="690.0" y1="248.0" x2="740.0" y2="248.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<text x="760.0" y="254.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="400">ある／ない</text>
<text x="1080.0" y="254.0" fill="#5d6873" font-size="20" text-anchor="middle" font-weight="700">判定</text>
<line x1="400.0" y1="280.0" x2="400.0" y2="296.0" stroke="#d8d4c8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="120" y="300" width="560" height="56" rx="12" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="400.0" y="335.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">AとBには関係がありそうですか？</text>
<line x1="690.0" y1="328.0" x2="740.0" y2="328.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<text x="760.0" y="334.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="400">仮説として</text>
<line x1="400.0" y1="360.0" x2="400.0" y2="376.0" stroke="#d8d4c8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="120" y="380" width="560" height="56" rx="12" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="400.0" y="415.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">AとBはどういう関係ですか？</text>
<line x1="690.0" y1="408.0" x2="740.0" y2="408.0" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="760.0" y="414.0" fill="#2f8f83" font-size="16" text-anchor="start" font-weight="400">関係の中身</text>
<line x1="400.0" y1="440.0" x2="400.0" y2="456.0" stroke="#d8d4c8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="120" y="460" width="560" height="56" rx="12" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="400.0" y="495.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="700">AとBの間には何がありますか？</text>
<line x1="690.0" y1="488.0" x2="740.0" y2="488.0" stroke="#5a4fcf" stroke-width="2" marker-end="url(#arrow)"/>
<text x="760.0" y="494.0" fill="#5a4fcf" font-size="16" text-anchor="start" font-weight="400">言葉で埋める</text>
<text x="1080.0" y="494.0" fill="#5a4fcf" font-size="20" text-anchor="middle" font-weight="700">生成</text>
<rect x="1030" y="200" width="100" height="360" rx="12" fill="none" stroke="#d8d4c8" stroke-width="1.5" stroke-dasharray="7 6"/>
<line x1="1080.0" y1="268.0" x2="1080.0" y2="462.0" stroke="#5d6873" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="50.0" y="572.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">最後の問いに答えるために必要なのは判定ではなく生成。それはアイデアを出すことそのもの。</text>
</g>
</svg>
