<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">「似ている」は、二点を結ぶ一本の線ではない</title>
<desc id="desc">線は見る側の前提の中にあり、前提が違えば判定は割れる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#5a4fcf" font-size="18" text-anchor="start" font-weight="700">RELEVANCE     02     図2-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">「似ている」は、二点を結ぶ一本の線ではない</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">線は見る側の前提の中にあり、前提が違えば判定は割れる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="100" y="205" width="440" height="360" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="320.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">頭の中のイメージ</text>
<circle cx="190.0" cy="380.0" r="13" fill="#5a4fcf"/>
<circle cx="450.0" cy="380.0" r="13" fill="#2f8f83"/>
<line x1="203.0" y1="380.0" x2="437.0" y2="380.0" stroke="#232a33" stroke-width="3"/>
<text x="190.0" y="425.0" fill="#5a4fcf" font-size="22" text-anchor="middle" font-weight="700">A</text>
<text x="450.0" y="425.0" fill="#2f8f83" font-size="22" text-anchor="middle" font-weight="700">B</text>
<text x="320.0" y="360.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">線がある？</text>
<text x="320.0" y="500.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="400">線は、AとBの間にはなく</text>
<text x="320.0" y="526.0" fill="#232a33" font-size="18" text-anchor="middle" font-weight="400">見る側の前提の中にある</text>
<rect x="640" y="205" width="460" height="360" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="870.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">不揃いな前提</text>
<text x="870.0" y="265.0" fill="#232a33" font-size="21" text-anchor="middle" font-weight="700">トマト と リンゴ</text>
<rect x="700" y="295" width="340" height="62" rx="14" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="870.0" y="322.0" fill="#d0693a" font-size="20" text-anchor="middle" font-weight="700">台所：違う</text>
<text x="870.0" y="354.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">野菜と果物</text>
<rect x="700" y="375" width="340" height="62" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="870.0" y="402.0" fill="#2f8f83" font-size="20" text-anchor="middle" font-weight="700">植物学：同じ</text>
<text x="870.0" y="434.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">どちらも果実</text>
<rect x="700" y="455" width="340" height="62" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="870.0" y="482.0" fill="#5a4fcf" font-size="20" text-anchor="middle" font-weight="700">食卓：似ている</text>
<text x="870.0" y="514.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">赤くて丸い</text>
<text x="870.0" y="548.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">どれも正しい。前提が違うだけ</text>
</g>
</svg>
