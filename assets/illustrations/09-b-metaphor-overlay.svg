<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">比喩は、二つの分布を強制的に重ねる装置</title>
<desc id="desc">直喩は距離を残し、隠喩はゼロにし、擬人法は人間という分布を重ねる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><radialGradient id="grel09b-1"><stop offset="0" stop-color="#5a4fcf" stop-opacity="0.55"/><stop offset="0.55" stop-color="#5a4fcf" stop-opacity="0.25"/><stop offset="1" stop-color="#5a4fcf" stop-opacity="0"/></radialGradient><radialGradient id="grel09b-2"><stop offset="0" stop-color="#d0693a" stop-opacity="0.55"/><stop offset="0.55" stop-color="#d0693a" stop-opacity="0.25"/><stop offset="1" stop-color="#d0693a" stop-opacity="0"/></radialGradient><radialGradient id="grel09b-3"><stop offset="0" stop-color="#5a4fcf" stop-opacity="0.55"/><stop offset="0.55" stop-color="#5a4fcf" stop-opacity="0.25"/><stop offset="1" stop-color="#5a4fcf" stop-opacity="0"/></radialGradient><radialGradient id="grel09b-4"><stop offset="0" stop-color="#d0693a" stop-opacity="0.55"/><stop offset="0.55" stop-color="#d0693a" stop-opacity="0.25"/><stop offset="1" stop-color="#d0693a" stop-opacity="0"/></radialGradient><radialGradient id="grel09b-5"><stop offset="0" stop-color="#2f8f83" stop-opacity="0.55"/><stop offset="0.55" stop-color="#2f8f83" stop-opacity="0.25"/><stop offset="1" stop-color="#2f8f83" stop-opacity="0"/></radialGradient><radialGradient id="grel09b-6"><stop offset="0" stop-color="#d0693a" stop-opacity="0.55"/><stop offset="0.55" stop-color="#d0693a" stop-opacity="0.25"/><stop offset="1" stop-color="#d0693a" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#5a4fcf" font-size="18" text-anchor="start" font-weight="700">RELEVANCE     09     図9-b</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">比喩は、二つの分布を強制的に重ねる装置</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">直喩は距離を残し、隠喩はゼロにし、擬人法は人間という分布を重ねる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="60" y="205" width="340" height="340" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="230.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">直喩：距離を残す</text>
<circle cx="160.0" cy="390.0" r="70" fill="url(#grel09b-1)"/>
<circle cx="300.0" cy="390.0" r="70" fill="url(#grel09b-2)"/>
<text x="160.0" y="395.0" fill="#5a4fcf" font-size="18" text-anchor="middle" font-weight="700">市場</text>
<text x="300.0" y="395.0" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">熊</text>
<text x="230.0" y="480.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="400">「市場は熊のようだ」</text>
<rect x="430" y="205" width="340" height="340" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="600.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">隠喩：距離をゼロに</text>
<circle cx="570.0" cy="390.0" r="80" fill="url(#grel09b-3)"/>
<circle cx="630.0" cy="390.0" r="80" fill="url(#grel09b-4)"/>
<text x="545.0" y="395.0" fill="#5a4fcf" font-size="18" text-anchor="middle" font-weight="700">市場</text>
<text x="655.0" y="395.0" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">熊</text>
<text x="600.0" y="480.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="400">「市場は熊だ」</text>
<rect x="800" y="205" width="340" height="340" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="970.0" y="239.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">擬人法：人間を重ねる</text>
<circle cx="950.0" cy="390.0" r="85" fill="url(#grel09b-5)"/>
<circle cx="990.0" cy="390.0" r="85" fill="url(#grel09b-6)"/>
<text x="925.0" y="395.0" fill="#2f8f83" font-size="18" text-anchor="middle" font-weight="700">風</text>
<text x="1015.0" y="395.0" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">人</text>
<text x="970.0" y="480.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="400">「風がささやく」</text>
<text x="600.0" y="570.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">型は違っても、重ねた瞬間に間に何かが立ち上がる。新しい関連の仮説が生成される</text>
</g>
</svg>
