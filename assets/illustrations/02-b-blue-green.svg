<text x="690.0" y="225.0" fill="#5d6873" font-size="18" text-anchor="middle" font-weight="400">？</text>
<line x1="870.0" y1="235.0" x2="870.0" y2="305.0" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 7"/>
<text x="870.0" y="225.0" fill="#5d6873" font-size="18" text-anchor="middle" font-weight="400">？</text>
<text x="600.0" y="345.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">どこから緑？</text>
<text x="600.0" y="395.0" fill="#232a33" font-size="19" text-anchor="middle" font-weight="400">言葉には輪郭があるが、言葉が指すものには輪郭がない</text>
