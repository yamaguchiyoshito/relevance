<text x="1050.0" y="340.0" fill="#2fa36a" font-size="24" text-anchor="end" font-weight="700">緑</text>
<line x1="330.0" y1="235.0" x2="330.0" y2="305.0" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 7"/>
<text x="330.0" y="225.0" fill="#5d6873" font-size="18" text-anchor="middle" font-weight="400">？</text>
<line x1="510.0" y1="235.0" x2="510.0" y2="305.0" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 7"/>
<text x="510.0" y="225.0" fill="#5d6873" font-size="18" text-anchor="middle" font-weight="400">？</text>
