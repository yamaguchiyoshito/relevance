<title id="title">境界は明確か？</title>
<desc id="desc">青から緑へ連続した帯のどこにも、境目は引けない</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><linearGradient id="g02b-bar" x1="0" x2="1"><stop offset="0" stop-color="#2b5fd9"/><stop offset="1" stop-color="#2fa36a"/></linearGradient></defs>
<rect width="1200" height="460" rx="20" fill="#f7f5ef"/>
