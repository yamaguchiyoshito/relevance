<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">人も言葉も、同じ図の上に</title>
<desc id="desc">人がキーワードになり、キーワードが人を結ぶ</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#5a4fcf" font-size="18" text-anchor="start" font-weight="700">RELEVANCE     07     図7-3</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">人も言葉も、同じ図の上に</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">人がキーワードになり、キーワードが人を結ぶ</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<line x1="300.0" y1="300.0" x2="460.0" y2="430.0" stroke="#d8d4c8" stroke-width="1.5"/>
<line x1="620.0" y1="240.0" x2="460.0" y2="430.0" stroke="#d8d4c8" stroke-width="1.5"/>
<line x1="620.0" y1="240.0" x2="760.0" y2="450.0" stroke="#d8d4c8" stroke-width="1.5"/>
<line x1="900.0" y1="320.0" x2="760.0" y2="450.0" stroke="#d8d4c8" stroke-width="1.5"/>
<line x1="900.0" y1="320.0" x2="1040.0" y2="460.0" stroke="#d8d4c8" stroke-width="1.5"/>
<line x1="620.0" y1="296.0" x2="620.0" y2="380.0" stroke="#d0693a" stroke-width="2"/>
<line x1="900.0" y1="320.0" x2="620.0" y2="380.0" stroke="#d0693a" stroke-width="2"/>
<circle cx="300.0" cy="278.0" r="11" fill="#5a4fcf"/>
<path d="M 284 322 C 284 296 316 296 316 322 Z" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="300.0" y="346.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">人A</text>
<circle cx="620.0" cy="218.0" r="11" fill="#5a4fcf"/>
<path d="M 604 262 C 604 236 636 236 636 262 Z" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="620.0" y="286.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">人B</text>
<circle cx="900.0" cy="298.0" r="11" fill="#5a4fcf"/>
<path d="M 884 342 C 884 316 916 316 916 342 Z" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="900.0" y="366.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">人C</text>
<rect x="400" y="412" width="120" height="36" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="460.0" y="436.0" fill="#2f8f83" font-size="15" text-anchor="middle" font-weight="700">分布</text>
<rect x="700" y="432" width="120" height="36" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="760.0" y="456.0" fill="#2f8f83" font-size="15" text-anchor="middle" font-weight="700">2ホップ</text>
<rect x="980" y="442" width="120" height="36" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="1040.0" y="466.0" fill="#2f8f83" font-size="15" text-anchor="middle" font-weight="700">レビュー</text>
<rect x="560" y="362" width="120" height="36" rx="10" fill="#ffffff" stroke="#d0693a" stroke-width="2"/>
<text x="620.0" y="386.0" fill="#d0693a" font-size="15" text-anchor="middle" font-weight="700">「人A」</text>
<path d="M 322 318 C 380 400 540 400 560 384" fill="none" stroke="#d0693a" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="385.0" y="418.0" fill="#d0693a" font-size="13" text-anchor="end" font-weight="400">人Aが、人Bと人Cの関心のキーワードになる</text>
<text x="600.0" y="560.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">人とキーワードを分けて扱う必要はない。どちらも同じ図の上のノード</text>
<text x="50.0" y="592.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">2ホップ：人Aと人Bは「分布」を介して、人Bと人Cは「2ホップ」と「人A」を介して結ばれる。</text>
</g>
</svg>
