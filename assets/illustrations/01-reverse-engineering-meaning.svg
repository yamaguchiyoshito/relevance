<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">仕組みを知るのではなく、振る舞いを逆再生する</title>
<desc id="desc">LLMの「分かっているように見える」を手がかりに、意味とは何かへ戻る</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="680" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#5a4fcf" font-size="18" text-anchor="start" font-weight="700">RELEVANCE     01</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">仕組みを知るのではなく、振る舞いを逆再生する</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">LLMの「分かっているように見える」を手がかりに、意味とは何かへ戻る</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="80" y="230" width="330" height="150" rx="14" fill="#ffffff" stroke="#5a4fcf" stroke-width="2"/>
<text x="245.0" y="301.0" fill="#5a4fcf" font-size="30" text-anchor="middle" font-weight="700">LLM</text>
<text x="245.0" y="333.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">確率的に尤もらしい次の語を選ぶ</text>
<text x="455.0" y="262.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">鳥が</text>
<rect x="520" y="246" width="126" height="18" rx="4" fill="#5a4fcf" opacity="0.80"/>
<text x="455.0" y="296.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">飛ぶ</text>
<rect x="520" y="280" width="100" height="18" rx="4" fill="#5a4fcf" opacity="0.71"/>
<text x="455.0" y="330.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">泳ぐ</text>
<rect x="520" y="314" width="25" height="18" rx="4" fill="#5a4fcf" opacity="0.44"/>
<text x="455.0" y="364.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="400">鳴く</text>
<rect x="520" y="348" width="61" height="18" rx="4" fill="#5a4fcf" opacity="0.57"/>
<text x="590.0" y="395.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">次の語の確率</text>
<rect x="790" y="230" width="330" height="150" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="955.0" y="301.0" fill="#2f8f83" font-size="30" text-anchor="middle" font-weight="700">意味とはなにか</text>
<text x="955.0" y="333.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">人間の側で起きていること</text>
<line x1="700.0" y1="305.0" x2="785.0" y2="305.0" stroke="#2f8f83" stroke-width="3" marker-end="url(#arrow)"/>
<text x="742.0" y="285.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">見えるもの</text>
<line x1="785.0" y1="345.0" x2="700.0" y2="345.0" stroke="#d0693a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="742.0" y="372.0" fill="#d0693a" font-size="18" text-anchor="middle" font-weight="700">逆再生</text>
<rect x="80" y="450" width="1040" height="150" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="7 7"/>
<rect x="130" y="485" width="300" height="80" rx="14" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="280.0" y="521.0" fill="#5d6873" font-size="22" text-anchor="middle" font-weight="700">蒸気機関</text>
<text x="280.0" y="553.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">先に動いていた</text>
<line x1="435.0" y1="525.0" x2="545.0" y2="525.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<text x="490.0" y="512.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">後から</text>
<rect x="550" y="485" width="300" height="80" rx="14" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="700.0" y="521.0" fill="#5d6873" font-size="22" text-anchor="middle" font-weight="700">熱力学</text>
<text x="700.0" y="553.0" fill="#5d6873" font-size="19" text-anchor="middle" font-weight="400">原理が追いついた</text>
<text x="1000.0" y="520.0" fill="#232a33" font-size="21" text-anchor="middle" font-weight="700">先行するモデルが</text>
<text x="1000.0" y="550.0" fill="#232a33" font-size="21" text-anchor="middle" font-weight="700">本質を暗示する</text>
<text x="50.0" y="652.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">知りたいのはLLMの仕組みではなく、その振る舞いから照らし返される「意味」の正体。</text>
</g>
</svg>
